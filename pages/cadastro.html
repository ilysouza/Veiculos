<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Veículos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="bg-light-subtle">

<nav class="navbar navbar-expand-lg bg-success-subtle">
  <div class="container-fluid">
    <span class="navbar-brand">Vitrine</span>
    <div class="collapse navbar-collapse">
      <div class="navbar-nav">
        <span class="nav-link">Início</span>
        <span class="nav-link active">Cadastrar Veículo</span>
      </div>
    </div>
  </div>
</nav>

    <div class="container mt-5 mb-5">
        <div class="card">
            <div class="card-header">
                <h3>Cadastro de Veículo</h3>
            </div>
            <div class="card-body">
                <div class="mt-2 row g-3">
                    <div class="col">
                        <label for="modelo" class="form-label">Modelo</label>
                        <input type="text" class="form-control" placeholder="Nome/modelo do veículo">
                    </div>
                    <div class="col">
                        <label for="formGroupExampleInput" class="form-label">Marca</label>
                        <input type="text" class="form-control" placeholder="Fabricante do veículo">
                    </div>
                </div>
                <div class="mt-1 row g-3">
                    <div class="col">
                        <label for="modelo" class="form-label">Ano de fabricação</label>
                        <input type="number" class="form-control" placeholder="Ano em que o veículo foi fabricado">
                    </div>
                    <div class="col">
                        <label for="formGroupExampleInput" class="form-label">Ano do modelo</label>
                        <input type="number" class="form-control" placeholder="Ano do modelo do veículo">
                    </div>
                </div>
                <div class="mt-1 row g-3">
                    <div class="col">
                        <label for="modelo" class="form-label">Cor</label>
                        <input type="text" class="form-control" placeholder="Cor do veículo">
                    </div>
                    <div class="col">
                        <label for="formGroupExampleInput" class="form-label">Categoria</label>
                        <input type="text" class="form-control" placeholder=" Tipo do veículo, por exemplo: hatch, sedan, SUV, picape, 
esportivo, utilitário etc...">
                    </div>
                </div>
                <div class="mt-1 row g-3">
                    <div class="col">
                        <label for="modelo" class="form-label">Combustível</label>
                        <select id="inputState" class="form-select">
                            <option selected>Selecione uma opção</option>
                            <option>Gasolina</option>
                            <option>Etanol</option>
                            <option>Flex</option>
                            <option>Diesel</option>
                            <option>Híbrido</option>
                            <option>Elétrico</option>
                        </select>
                    </div>
                    <div class="col">
                        <label for="formGroupExampleInput" class="form-label">Câmbio</label>
                        <select id="inputState" class="form-select">
                            <option selected>Selecione uma opção</option>
                            <option>Manual</option>
                            <option>Automático</option>
                        </select>
                    </div>
                </div>
                <div class="mt-1 row g-3">
                    <div class="col">
                        <label for="formFile" class="form-label">Quilometragem</label>
                        <div class="input-group mb-3">
                            <input type="number" class="form-control" placeholder="Quantidade de quilômetros rodados">
                            <span class="input-group-text">KM</span>
                        </div>
                    </div>
                    <div class="col">
                        <label for="formGroupExampleInput" class="form-label">Preço</label>
                        <label class="visually-hidden" for="autoSizingInputGroup">Preço</label>
                        <div class="input-group">
                            <div class="input-group-text">R$</div>
                            <input type="text" class="form-control" placeholder="Valor de venda do veículo">
                        </div>
                    </div>
                </div>
                <div class="mt-1 row g-3">
                    <div class="col">
                        <label for="formFile" class="form-label">Imagem do veículo</label>
                        <input class="form-control" type="file" id="formFile">
                    </div>
                    <div class="col">
                        <label for="modelo" class="form-label">Descrição</label>
                        <textarea class="form-control"
                            placeholder="Breve descrição sobre o veículo, estado de conservação, opcionais e observações."
                            rows="1"></textarea>
                    </div>
                </div>

                <div class="mt-4 col-12">
                    <button type="submit" class="btn btn-primary">Cadastrar Veículo</button>
                </div>
            </div>
        </div>


    </div>

    <div class="footer mb-2 text-body-secondary text-center">
        Gabrielly Gonçalves e Rafaelly de Souza
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
