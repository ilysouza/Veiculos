<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="bg-light-subtle">
    <div class="card position-absolute top-50 start-50 translate-middle bg-success-subtle" style="width: 40rem;">
        <div class="card-body">
            <form>
                <div class="mb-3">
                    <label class="form-label">Endereço de E-mail</label>
                    <input type="email" class="form-control" placeholder="usuario@exemplo.com">
                    <div id="emailHelp" class="form-text">Nunca compartilharemos seu e-mail com ninguém.</div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Senha</label>
                    <input type="password" class="form-control">
                </div>
                <a class="btn btn-primary" href="./index.html" role="button">Entrar</a>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>

</html>
